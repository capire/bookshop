<!DOCTYPE html>
<html>

<head>
  <title> Capire Books </title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/primitive-ui/dist/css/main.css">
  <style>
    .hovering tr:hover td { color:cyan; background: #123; cursor: pointer; }
    .succeeded { color:teal; padding-right: 11px; }
    .failed { color:red; padding-right: 11px; }
  </style>
</head>

<body class="small-container", style="margin-top: 70px;">
  <div id='app'>

    <h1> Capire Books </h1>

    <input type="text" placeholder="Search..." @input="fetch($event.target.value)">

    <table class="hovering">
      <thead>
        <th> Book </th>
        <th> Author </th>
        <th> Genre </th>
        <th> Rating </th>
        <th> Price </th>
      </thead>
      <tr v-for="b,i in books" @click="inspect(i)">
        <td>{{ b.title }}</td>
        <td>{{ b.author }}</td>
        <td>{{ b.genre }}</td>
        <td>{{ stars[ b.rating ? Math.round(b.rating) : 1+(4-i)%5 ] }} ({{ b.reviews||b.ID%49 }}) </td>
        <td>{{ b.currency }} {{ b.price }}</td>
      </tr>
    </table>

    <div v-if="details">
      <label style="text-align:right">
        <span :class="order"> {{ order.succeeded || order.failed }} </span>
        <span  class="stock"> {{ details.stock }} in stock </span>
      </label>
      <form @submit.prevent="submitOrder" style="float:right; display:flex; flex-direction:row-reverse">
        <input type="number" v-model="order.quantity" v-bind:class="{ failed: order.failed }" style="width:5em">
        <input type="submit" value="Order:" class="muted-button">
      </form>
      <h4> {{ details.title }} </h4>
      <p> {{ details.descr }} </p>
    </div>
    <div v-else>
      ( click on a row to see details... )
    </div>

  </div>

  <script src="/@cap.core/imports.js"></script>
  <script type="module">
    import { createApp, reactive, ref } from "https://unpkg.com/vue@3/dist/vue.esm-browser.prod.js"
    const $ = s => document.querySelector (s)

    import * as cds from '@cap.core/connect'
    const { GET, POST } = await cds.connect.to `CatalogService`

    createApp ({ setup() {

      const stars = [ '☆☆☆☆☆', '★☆☆☆☆', '★★☆☆☆', '★★★☆☆', '★★★★☆', '★★★★★' ]
      const books = ref([]), details = ref()
      const order = reactive({ quantity:1 })

      return { books, details, order, stars,

        async fetch (terms) {
          const q = GET `ListOfBooks` .orderBy `title` .limit(10)
          if (terms) q.where`$search(${terms})`
          books.value = await q
        },

        async inspect (index) {
          const {ID} = details.value = books.value [index]
          // let [{ descr, stock }] = await GET `descr, stock` .from `Books` .where `ID = ${ID}`
          // let { descr, stock } = await GET `one descr, stock from Books where ID = ${ID}`
          // let { descr, stock } = await GET `descr, stock from Books [${ID}]`
          let { descr, stock } = await GET `descr, stock` .from (`Books`,ID)
          // let { descr, stock } = await GET `Books [${ID}] { descr, stock }`
          // let { descr, stock } = await GET (`Books`,ID,`{ descr, stock }`)
          // let { descr, stock } = await GET (`Books`,ID,`descr, stock`)
          details.value.descr = descr
          details.value.stock = stock
          setTimeout (()=> $('form > input').focus(), 11) // focus input field after rendering
          order.succeeded = order.failed = undefined // reset messages displayed before
        },

        async submitOrder() {
          order.succeeded = order.failed = undefined // reset messages displayed before
          try {
            const { ID:book } = details.value, { quantity } = order
            const { stock } = await POST (`submitOrder`, { book, quantity })
            details.value.stock = stock
            order.succeeded = `Successfully ordered ${quantity} item(s).`
          } catch (e) {
            order.failed = e.message
            throw e
          }
        },
      }

    }}) .mount('#app') .fetch() // initially fill list of books
    $('#app > input').focus()


    // Expose `cds` globally for debugging purposes
    import * as cx from '@cap.core/connect'
    import * as ql from '@cap.core/ql'
    window.cds = {...cx,ql}
  </script>

</body>
</html>
