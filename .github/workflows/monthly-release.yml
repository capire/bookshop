name: Monthly Release

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1-7 * 3" # First Wednesday every month

permissions:
  contents: write
  deployments: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Needed so npm version can create and push tags
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org/"

      - name: Install dependencies
        run: npm i

      - name: Check for new commits since last tag
        id: check_commits
        run: |
          git fetch --tags
          last_tag=$(git describe --tags --abbrev=0)
          echo "Last tag: $last_tag"

          count=$(git rev-list "${last_tag}..HEAD" --count)
          echo "Commits since last tag: $count"

          if [ "$count" -gt 0 ]; then
            echo "has_new_commits=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_new_commits=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version (patch)
        if: steps.check_commits.outputs.has_new_commits == 'true'
        env:
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          npm version patch -m "chore(release): %s [skip ci]"

      - name: Push changes and tags
        if: steps.check_commits.outputs.has_new_commits == 'true'
        run: |
          git push origin HEAD:monthly-release


